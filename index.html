<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PARISI Warehouse 2</title>
  <style>
    *{box-sizing:border-box} :root{--bg:#0d1d28;--panel:#142938;--line:rgba(255,255,255,.12);--muted:#9fb1bf;--accent:#ffb097;--accent2:#ff8d72}
    body{margin:0;font-family:Arial,sans-serif;min-height:100vh;background:radial-gradient(circle at top left,#203d50 0,#0d1d28 42%,#071019 100%);color:#f8fbff;padding-bottom:86px}
    .app{max-width:520px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,rgba(17,38,52,.96),rgba(8,18,27,.98));border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08)}
    .topbar{padding:24px 18px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px}.logo{font-size:30px;letter-spacing:3px;font-weight:300;color:#f2c1b2}.title{border-left:1px solid rgba(255,255,255,.25);padding-left:12px}.title h1{margin:0;font-size:17px}.title p{margin:5px 0 0;font-size:12px;color:var(--muted)}
    .content{padding:18px}.label-top{font-size:13px;font-weight:700;letter-spacing:.5px;margin-bottom:10px;color:#d7e3ec}.search-row{display:grid;grid-template-columns:1fr 128px;gap:10px;margin-bottom:16px}.search-box{position:relative}.search-box span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#6d7d89;font-size:20px}input,select{width:100%;height:56px;border:0;border-radius:9px;outline:0;padding:0 15px 0 48px;font-size:18px;font-weight:700;color:#172431;background:#fff;text-transform:uppercase}button{border:0;cursor:pointer;font-weight:800}.btn-search{height:56px;border-radius:9px;color:#1c2730;background:linear-gradient(180deg,var(--accent),var(--accent2));font-size:15px}.status{color:var(--muted);font-size:12px;min-height:18px;margin-bottom:12px}.summary{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.summary-box{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px}.summary-number{font-size:24px;font-weight:900;color:var(--accent)}.summary-label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;margin-top:3px}.results{display:grid;gap:14px}.result-card{background:linear-gradient(180deg,rgba(25,51,70,.96),rgba(17,36,50,.96));border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 12px 28px rgba(0,0,0,.28)}.result-title{color:var(--accent);font-size:13px;font-weight:900;margin-bottom:14px;text-transform:uppercase}.result-main{display:grid;grid-template-columns:1fr 118px;gap:14px}.big-label{color:var(--muted);font-size:12px;margin-bottom:5px;text-transform:uppercase;font-weight:800}.code{font-size:27px;font-weight:900;margin-bottom:16px}.location{font-size:30px;font-weight:900;margin-bottom:16px}.mini-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px;color:#d6e2ea}.mini-grid b{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;text-transform:uppercase}.side-panel{display:grid;gap:10px}.status-box{border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;min-height:84px;color:var(--accent);font-weight:900;text-align:center}.view-map,.label-action{border-radius:11px;min-height:50px;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#1c2730;font-size:15px}.label-action{background:#fff;border:2px solid var(--accent2)}.details{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:10px;border-radius:11px;font-size:14px;color:#fff;min-height:48px}.field .label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:900;margin-bottom:4px}.field.full{grid-column:1/-1}.empty{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;color:#dce6ec}.map-preview{margin-top:18px;background:#fff;color:#162431;border-radius:14px;padding:14px}.map-preview img{width:100%;border-radius:10px;display:block}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;height:74px;background:rgba(9,20,29,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav-item{display:grid;place-items:center;align-content:center;gap:3px;color:#91a5b3;font-size:11px;text-decoration:none}.nav-item strong{font-size:22px}.nav-item.active{color:var(--accent)}
    @media (min-width:900px){body{padding-bottom:0;overflow:hidden}.app{max-width:none;width:100%;height:100vh;display:grid;grid-template-columns:340px 1fr;grid-template-rows:96px 1fr 42px;background:#f4f7fb}.topbar{grid-column:1/-1;height:96px;padding:0 26px;background:linear-gradient(90deg,#071019,#0d1d28 48%,#0a1420)}.content{grid-column:1;grid-row:2;overflow:auto;background:linear-gradient(180deg,#0d1d28,#071019);border-right:1px solid rgba(255,255,255,.08)}.desktop-map-area{display:block!important;grid-column:2;grid-row:2;padding:22px;color:#172431;overflow:auto;background:#f4f7fb}.map-preview{display:none}.bottom-nav{display:none}.result-main{grid-template-columns:1fr}.side-panel{grid-template-columns:1fr}.desktop-panel{background:#fff;border:1px solid #dce4eb;border-radius:16px;padding:18px;box-shadow:0 10px 24px rgba(9,20,29,.08)}.desktop-panel img{width:100%;max-height:520px;object-fit:contain}.desktop-footer{display:flex!important;grid-column:1/-1;grid-row:3;align-items:center;justify-content:space-between;padding:0 24px;background:#071019;color:#91a5b3;font-size:12px}.desktop-nav{display:flex!important;margin-left:auto;gap:28px}.desktop-nav a{color:#b8c6d2;text-decoration:none;font-size:13px;font-weight:900}.desktop-nav a.active{color:#ffb097}}
    .desktop-nav,.desktop-map-area,.desktop-footer{display:none}
    .label-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}.label-modal.open{display:flex}.label-modal-card{width:min(920px,100%);max-height:92vh;overflow:auto;background:#f4f7fb;color:#172431;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}.label-modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#142938;color:#fff;position:sticky;top:0;z-index:2}.label-close{background:rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:50%;font-size:22px}.label-controls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid #dce4eb}.label-controls label{font-size:11px;font-weight:900;color:#526676;text-transform:uppercase}.label-controls input,.label-controls select{height:42px;border:1px solid #cad4dc;border-radius:8px;padding:0 10px;font-size:15px;font-weight:800;box-shadow:none}.label-controls .wide{grid-column:span 2}.label-actions-row{display:flex;gap:10px;padding:0 16px 14px;background:#fff}.label-print-btn,.label-refresh-btn{height:42px;border-radius:9px;padding:0 16px;font-size:14px}.label-print-btn{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#1c2730}.label-refresh-btn{background:#142938;color:#fff}.label-preview-wrap{padding:18px;display:flex;justify-content:center;background:#eef3f7}
    #printArea{background:#fff;color:#000;width:794px;min-height:1040px;padding:0;font-family:Arial,Helvetica,sans-serif}.label-sheet{width:100%;background:#fff;padding:0 20px}.standard-label{height:330px;border-bottom:2px solid #ddd;padding:14px 22px 8px;page-break-inside:avoid;break-inside:avoid}.standard-top{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:end}.standard-black-title{background:#111;color:#fff;font-size:22px;font-weight:900;line-height:30px;padding:0 7px;text-transform:uppercase}.standard-date-value{font-size:42px;font-weight:900;line-height:48px}.standard-cont-title{font-size:23px;font-weight:900;text-align:center}.standard-cont-value{font-size:33px;font-weight:900;text-align:center}.standard-code-area{margin-top:32px;display:grid;grid-template-columns:1fr 105px;gap:14px;align-items:end}.standard-code-title{text-align:center;font-size:26px;font-weight:900}.standard-code-value{text-align:center;font-size:54px;line-height:60px;font-weight:900;letter-spacing:.5px}.standard-qty-title{text-align:center;font-size:20px;font-weight:900}.standard-qty-value{text-align:center;font-size:32px;font-weight:900;margin-top:8px}.bath-label-copy{height:370px;margin:0 18px 26px;border:2px solid #111;padding:24px;box-sizing:border-box;page-break-inside:avoid}.bath-top{display:grid;grid-template-columns:1fr 1fr;align-items:start;border-bottom:3px solid #111;padding-bottom:12px}.bath-model{font-size:42px;font-weight:900}.bath-date{text-align:right;font-size:21px;font-weight:900}.bath-container{font-size:25px;margin-top:4px}.bath-code-title{font-size:28px;font-weight:900;margin-top:32px}.bath-code-main{font-size:60px;line-height:68px;font-weight:900;margin-top:10px}.bath-bottom{display:grid;grid-template-columns:1fr 1fr;margin-top:45px;font-size:21px;font-weight:900}.bath-bottom div:last-child{text-align:right}
    @media(max-width:700px){.label-controls{grid-template-columns:1fr 1fr}.label-controls .wide{grid-column:1/-1}#printArea{width:100%;min-height:auto}.standard-label{height:300px;padding:10px}.standard-black-title{font-size:18px}.standard-date-value{font-size:34px}.standard-cont-title{font-size:18px}.standard-cont-value{font-size:25px}.standard-code-value{font-size:38px}.bath-label-copy{height:260px;margin:0 8px 14px}.bath-model{font-size:32px}.bath-code-main{font-size:42px}.bath-bottom{margin-top:25px}}
    @media print{body *{visibility:hidden!important}#printArea,#printArea *{visibility:visible!important}#printArea{position:absolute;left:0;top:0;width:100%;min-height:auto}.label-modal,.label-modal-card,.label-preview-wrap{display:block!important;background:#fff!important;padding:0!important;margin:0!important;box-shadow:none!important;max-height:none!important;overflow:visible!important}.label-modal-header,.label-controls,.label-actions-row{display:none!important}@page{size:A4 portrait;margin:10mm}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><div class="logo">PARISI</div><div class="title"><h1>Warehouse 2</h1><p>Pallet Location System</p></div></div><nav class="desktop-nav"><a class="active" href="index.html">⌕ Search</a><a href="#" onclick="openMap();return false;">♧ Map</a></nav></header>
    <section class="content"><div class="label-top">SEARCH PRODUCT CODE</div><div class="search-row"><div class="search-box"><span>⌕</span><input id="searchInput" type="text" placeholder="PA110" autocomplete="off" /></div><button class="btn-search" onclick="searchData()">SEARCH</button></div><div id="status" class="status">Loading data...</div><div id="summary" class="summary"><div class="summary-box"><div id="totalPallets" class="summary-number">0</div><div class="summary-label">Total locations</div></div><div class="summary-box"><div id="totalQty" class="summary-number">0</div><div class="summary-label">Total quantity</div></div></div><div id="results" class="results"></div><div id="mobileMapPreview" class="map-preview"><h2>WAREHOUSE 2 MAP</h2><img src="warehouse2-map.jpg" alt="PARISI Warehouse 2 Map" /></div></section>
    <section class="desktop-map-area"><div class="desktop-panel"><h2>WAREHOUSE 2 MAP</h2><img src="warehouse2-map.jpg" alt="PARISI Warehouse 2 Map" /></div></section><footer class="desktop-footer"><span>© 2026 PARISI - Warehouse 2 Pallet Location System</span><span>● Connected to Google Sheets</span></footer>
  </main>
  <nav class="bottom-nav"><a class="nav-item active" href="index.html"><strong>⌕</strong><span>Search</span></a><a class="nav-item" href="#" onclick="openMap();return false;"><strong>♧</strong><span>Map</span></a><a class="nav-item" href="#" onclick="alert('Dashboard can be added later.');return false;"><strong>▥</strong><span>Dashboard</span></a><a class="nav-item" href="#" onclick="clearSearch();return false;"><strong>⚙</strong><span>Clear</span></a></nav>
  <div id="labelModal" class="label-modal" onclick="closeLabelModal(event)"><div class="label-modal-card" onclick="event.stopPropagation()"><div class="label-modal-header"><h2>Print Label</h2><button class="label-close" onclick="closeLabelModal()">×</button></div><div class="label-controls"><div><label>Template</label><select id="labelTemplate" onchange="renderLabelPreview()"><option value="PK">PK</option><option value="BATH">BATH</option></select></div><div><label>Code</label><input id="labelCode" oninput="renderLabelPreview()" /></div><div><label>QTY</label><input id="labelQty" oninput="renderLabelPreview()" /></div><div><label>Date</label><input id="labelDate" oninput="renderLabelPreview()" /></div><div><label>CONT N</label><input id="labelContainer" placeholder="TYPE HERE" oninput="renderLabelPreview()" /></div><div class="wide"><label>Bath model/name</label><input id="labelBathModel" value="ELLI II" oninput="renderLabelPreview()" /></div></div><div class="label-actions-row"><button class="label-refresh-btn" onclick="renderLabelPreview()">UPDATE PREVIEW</button><button class="label-print-btn" onclick="window.print()">PRINT LABEL</button></div><div class="label-preview-wrap"><div id="printArea"></div></div></div></div>
  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/17fTtL15_RX1SuhnRLCoxdf7QQC6WDHyu4W3yQU7PVSk/gviz/tq?tqx=out:csv&sheet=Planilha1";
    let warehouseData = []; let currentResults = [];
    function parseCSV(text){const rows=[];let row=[],value="",q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){value+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(value);value=""}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(value);if(row.some(cell=>cell.trim()!==""))rows.push(row);row=[];value=""}else value+=c}if(value||row.length){row.push(value);if(row.some(cell=>cell.trim()!==""))rows.push(row)}return rows}
    function normalizeItem(item){const f={};Object.keys(item).forEach(k=>f[k.trim()]=item[k]);f.BIN=f.BIN||f.Bin||f.bin||"";f.Street=f.Street||f.street||"";f.Building=f.Building||f.building||"";f.Level=f.Level||f.level||"";f.Side=f.Side||f.side||"";f.CODE=f.CODE||f.Code||f.code||"";f.Qty=f.Qty||f.QTY||f.Quantity||f.quantity||"";f.Section=f.Section||f.section||"";f.Status=f.Status||f.status||"";f.Observation=f.Observation||f.Notes||f.notes||"";return f}
    function loadData(){const v=Date.now();fetch(GOOGLE_SHEET_CSV_URL+"&v="+v).then(r=>{if(!r.ok)throw new Error();return r.text()}).then(loadRowsFromCsv).catch(()=>fetch("data.csv?v="+v).then(r=>r.text()).then(loadRowsFromCsv).catch(()=>{document.getElementById('status').textContent='Error loading data. Please check Google Sheets or data.csv.'}))}
    function loadRowsFromCsv(text){const rows=parseCSV(text);const headers=rows[0].map(h=>String(h||'').trim());warehouseData=rows.slice(1).map(row=>{const item={};headers.forEach((h,i)=>item[h]=row[i]?String(row[i]).trim():"");return normalizeItem(item)}).filter(item=>Object.values(item).some(v=>String(v||'').trim()!==""));document.getElementById('status').textContent=warehouseData.length+' items loaded successfully.';document.getElementById('results').innerHTML='<div class="empty">Type a product code to search.</div>'}
    function parseQty(v){const n=parseFloat(String(v||'').replace(/,/g,'').replace(/[^\d.-]/g,''));return isNaN(n)?0:n}
    function searchData(){const q=document.getElementById('searchInput').value.trim().toLowerCase();const resultsDiv=document.getElementById('results'),summary=document.getElementById('summary');summary.style.display='none';if(!q){currentResults=[];resultsDiv.innerHTML='<div class="empty">Type a product code to search.</div>';return}const results=warehouseData.filter(item=>Object.values(item).some(v=>String(v||'').toLowerCase().includes(q)));currentResults=results;if(!results.length){resultsDiv.innerHTML='<div class="empty">No results found.</div>';return}document.getElementById('totalPallets').textContent=results.length.toLocaleString('en-US');document.getElementById('totalQty').textContent=results.reduce((s,item)=>s+parseQty(item.Qty),0).toLocaleString('en-US');summary.style.display='grid';resultsDiv.innerHTML=results.map((item,i)=>createCard(item,i)).join('')}
    function createCard(item,index){const bin=safe(item.BIN||`${item.Street||''}${item.Building||''}${item.Level||''}${item.Side||''}`);return `<div class="result-card"><div class="result-title">📍 Search Result</div><div class="result-main"><div><div class="big-label">Code</div><div class="code">${safe(item.CODE)}</div><div class="big-label">Location</div><div class="location">${bin}</div><div class="mini-grid"><div><b>Street</b>${safe(item.Street)}</div><div><b>Position</b>${safe(item.Building)}</div><div><b>Level/Side</b>${safe(item.Level)}${safe(item.Side)}</div></div></div><div class="side-panel"><div class="status-box">▧<br>${safe(item.Status||'Occupied')}</div><button class="view-map" onclick="openMap()">♧ VIEW MAP</button><button class="label-action" onclick="openLabel(${index})">🏷 LABEL</button></div></div><div class="details"><div class="field"><span class="label">Quantity</span>${safe(item.Qty)}</div><div class="field"><span class="label">Section</span>${safe(item.Section)}</div><div class="field full"><span class="label">Notes</span>${safe(item.Observation)}</div></div></div>`}
    function todayLabelDate(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}
    function isBathItem(item){return `${item.Section||''} ${item.Observation||''} ${item.CODE||''}`.toLowerCase().includes('bath')}
    function openLabel(index){const item=currentResults[index];if(!item)return;document.getElementById('labelTemplate').value=isBathItem(item)?'BATH':'PK';document.getElementById('labelCode').value=String(item.CODE||'').toUpperCase();document.getElementById('labelQty').value=String(item.Qty||'').toUpperCase();document.getElementById('labelDate').value=todayLabelDate();document.getElementById('labelContainer').value='';if(!document.getElementById('labelBathModel').value)document.getElementById('labelBathModel').value='ELLI II';document.getElementById('labelModal').classList.add('open');renderLabelPreview();setTimeout(()=>document.getElementById('labelContainer').focus(),100)}
    function closeLabelModal(event){if(event&&event.target&&event.target.id!=='labelModal')return;document.getElementById('labelModal').classList.remove('open')}
    function renderLabelPreview(){const template=document.getElementById('labelTemplate').value;const code=safe(document.getElementById('labelCode').value||'');const qty=safe(document.getElementById('labelQty').value||'');const date=safe(document.getElementById('labelDate').value||todayLabelDate());const cont=safe((document.getElementById('labelContainer').value||'').toUpperCase());const contDisplay=cont||'-';const bathModel=safe(document.getElementById('labelBathModel').value||'ELLI II');const printArea=document.getElementById('printArea');if(template==='BATH'){const oneBath=`<div class="bath-label-copy"><div class="bath-top"><div class="bath-model">${bathModel}</div><div class="bath-date"><div>${date}</div><div class="bath-container">${contDisplay}</div></div></div><div class="bath-code-title">CODE:</div><div class="bath-code-main">${code}</div><div class="bath-bottom"><div>QTY: ${qty}</div><div>CONT N: ${contDisplay}</div></div></div>`;printArea.innerHTML=`<div class="label-sheet">${oneBath}${oneBath}</div>`;return}const oneStandard=`<div class="standard-label"><div class="standard-top"><div><div class="standard-cont-title">CONT N:</div><div class="standard-cont-value">${contDisplay}</div></div><div><div class="standard-black-title">DELIVERY DATE:</div><div class="standard-date-value">${date}</div></div></div><div class="standard-code-area"><div><div class="standard-code-title">CODE:</div><div class="standard-code-value">${code}</div></div><div><div class="standard-qty-title">QTY:</div><div class="standard-qty-value">${qty}</div></div></div></div>`;printArea.innerHTML=`<div class="label-sheet">${oneStandard}${oneStandard}${oneStandard}</div>`}
    function openMap(){const m=document.getElementById('mobileMapPreview');if(window.innerWidth<900&&m)m.scrollIntoView({behavior:'smooth',block:'start'});else window.open('warehouse2-map.jpg','_blank')}
    function safe(value){if(!value)return '-';return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
    function clearSearch(){document.getElementById('searchInput').value='';document.getElementById('results').innerHTML='<div class="empty">Type a product code to search.</div>';document.getElementById('summary').style.display='none';currentResults=[];document.getElementById('searchInput').focus()}
    document.getElementById('searchInput').addEventListener('keyup',e=>{if(e.key==='Enter')searchData()});loadData();
  </script>
</body>
</html>
